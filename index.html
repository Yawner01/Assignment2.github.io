<body>
    <!-- putting the webpage content-->
     <h1>Wesley Yawn </h1>
     <h1>COP4813 - Web Applications Programming</h1>
     <h1>Computer Science</h1>
     <h2>Welcome to my dynamic webpage!</h2>
    <script>
  // run after the body exists
  window.addEventListener('DOMContentLoaded', () => {
    const hour = new Date().getHours();
    let bg = 'white';

    if (hour >= 6 && hour < 12) {
      bg = 'blue';
    } else if (hour >= 12 && hour < 18) {
      bg = 'orange';
    } else if (hour >= 18 && hour < 21) {
      bg = 'purple';
    } else {
      // covers hour >= 21 OR hour < 6
      bg = 'black';
    }

    document.body.style.backgroundColor = bg;
  });
</script>
</body>
</html>
