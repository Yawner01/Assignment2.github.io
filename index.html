<body>
    <!-- putting the webpage content-->
     <h1>Wesley Yawn </h1>
     <h1>COP4813 - Web Applications Programming</h1>
     <h1>Computer Science</h1>
     <h2>Welcome to my dynamic webpage!</h2>
    <script>
  window.addEventListener('DOMContentLoaded', () => {
    const hour = new Date().getHours();
    let bg = 'white';
    let textColor = 'black';       // ← default

    if (hour >= 6 && hour < 12) {
      bg = 'blue';
      textColor = 'black';
    } else if (hour >= 12 && hour < 18) {
      bg = 'orange';
      textColor = 'black';
    } else if (hour >= 18 && hour < 21) {
      bg = 'purple';
      textColor = 'white';
    } else {
      bg = 'black';
      textColor = 'white';
    }

    document.body.style.backgroundColor = bg;
    document.body.style.color = textColor;   // ← apply text color
  });
</script>
</body>
</html>
